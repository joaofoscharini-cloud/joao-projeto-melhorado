<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Central de Resenhas de Filmes, Games e Músicas">
  <title>Central de Resenhas 🎬🎮🎵</title>
  
  <style>
    /* ==========================================
       1. VARIÁVEIS DE TEMA & CONFIGURAÇÕES BASE
       ========================================== */
    :root[data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --star-color: #f59e0b;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    :root[data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.8);
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --star-color: #d97706;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    /* ==========================================
       2. CABEÇALHO & PAINEL DE ESTATÍSTICAS
       ========================================== */
    .main-header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 2rem 1.5rem;
      text-align: center;
      position: relative;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 1rem;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-item {
      background: var(--bg-primary);
      padding: 0.5rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .stat-item strong {
      color: var(--accent);
      font-size: 1.1rem;
    }

    /* ==========================================
       3. LAYOUT & FORMULÁRIO
       ========================================== */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .form-container {
      background: var(--bg-secondary);
      padding: 1.8rem;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      height: fit-content;
      position: sticky;
      top: 2rem;
    }

    .form-container h2 {
      margin-bottom: 1.2rem;
      font-size: 1.3rem;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Rating Estrelas Dinâmico */
    .star-rating-input {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      gap: 0.3rem;
      font-size: 1.5rem;
    }

    .star-rating-input input {
      display: none;
    }

    .star-rating-input label {
      cursor: pointer;
      color: var(--border-color);
      transition: color 0.2s;
    }

    .star-rating-input label:hover,
    .star-rating-input label:hover ~ label,
    .star-rating-input input:checked ~ label {
      color: var(--star-color);
    }

    .image-preview {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      object-fit: cover;
      margin-top: 0.5rem;
      display: none;
      border: 1px solid var(--border-color);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* ==========================================
       4. CONTROLES DE BUSCA E FILTROS
       ========================================== */
    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .controls-header {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .sort-select {
      width: auto;
      min-width: 160px;
    }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .filter-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* ==========================================
       5. GRID DE CARDS & RESENHAS
       ========================================== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.4s ease-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: var(--bg-secondary);
    }

    .card-body {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-header-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      text-transform: capitalize;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
    }

    .card-rating {
      color: var(--star-color);
      margin-bottom: 0.8rem;
      font-size: 0.9rem;
    }

    .card-review {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 1rem;
      flex: 1;
      word-break: break-word;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: var(--bg-primary);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      width: fit-content;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .action-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.2rem;
      border-radius: 4px;
      transition: transform 0.1s;
    }

    .action-btn:hover {
      transform: scale(1.2);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-secondary);
    }

    .empty-state span {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent);
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      box-shadow: var(--card-shadow);
      display: none;
      animation: slideUp 0.3s ease;
      z-index: 1000;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-top">
      <h1>Central de Resenhas 🍿🎮🎧</h1>
      <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <span id="themeIcon">🌙</span> <span id="themeText">Modo Escuro</span>
      </button>
    </div>
    <p>Guarde as suas opiniões, organize suas notas e filtre seus conteúdos favoritos</p>

    <div class="stats-bar">
      <div class="stat-item">Total: <strong id="totalCount">0</strong></div>
      <div class="stat-item">Média das Notas: <strong id="avgRating">0.0 ⭐</strong></div>
      <div class="stat-item">Favoritos: <strong id="favCount">0 ❤️</strong></div>
    </div>
  </header>

  <div class="container">
    <section class="form-container" aria-labelledby="form-heading">
      <h2 id="form-heading">+ Adicionar Resenha</h2>
      <form id="reviewForm">
        <div class="form-group">
          <label for="title">Título</label>
          <input type="text" id="title" placeholder="Ex: Interstellar, Chrono Trigger..." required>
        </div>

        <div class="form-group">
          <label for="category">Categoria</label>
          <select id="category" required>
            <option value="filme">🎬 Filme</option>
            <option value="game">🎮 Game</option>
            <option value="musica">🎵 Música</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nota</label>
          <div class="star-rating-input">
            <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5 estrelas">★</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 estrelas">★</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 estrelas">★</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 estrelas">★</label>
            <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 estrela">★</label>
          </div>
        </div>

        <div class="form-group">
          <label for="imageUrl">URL da Capa/Pôster (Opcional)</label>
          <input type="url" id="imageUrl" placeholder="https://exemplo.com/imagem.jpg">
          <img id="imagePreview" class="image-preview" alt="Pré-visualização da Capa">
        </div>

        <div class="form-group">
          <label for="tag">Tag Especial</label>
          <input type="text" id="tag" placeholder="Ex: Final incrível, Para relaxar...">
        </div>

        <div class="form-group">
          <label for="review">A sua Opinião</label>
          <textarea id="review" placeholder="Escreva um breve comentário..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Publicar Resenha</button>
      </form>
    </section>

    <main>
      <section class="controls-section">
        <div class="controls-header">
          <div class="search-box">
            <input type="search" id="searchInput" placeholder="🔍 Pesquisar por título, tag ou opinião..." aria-label="Pesquisar resenhas">
          </div>
          <select id="sortSelect" class="sort-select" aria-label="Ordenar resenhas">
            <option value="newest">Mais recentes</option>
            <option value="rating-high">Maior Nota</option>
            <option value="rating-low">Menor Nota</option>
          </select>
        </div>

        <nav class="filter-bar" aria-label="Filtro de categoria">
          <button class="filter-btn active" data-category="todos">Todos</button>
          <button class="filter-btn" data-category="filme">🎬 Filmes</button>
          <button class="filter-btn" data-category="game">🎮 Games</button>
          <button class="filter-btn" data-category="musica">🎵 Músicas</button>
        </nav>
      </section>

      <section class="cards-grid" id="cardsGrid" aria-live="polite" aria-label="Lista de resenhas">
        </section>
    </main>
  </div>

  <div id="toast" class="toast">Ação realizada com sucesso!</div>

  <script>
    // Resenhas Iniciais (Exemplo de demonstração)
    const initialReviews = [
      {
        id: '1',
        title: 'Interstellar',
        category: 'filme',
        rating: 5,
        imageUrl: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500',
        tag: 'Ficção Científica',
        review: 'Uma obra-prima do cinema sobre tempo, espaço e amor. Trilha sonora inesquecível de Hans Zimmer.',
        favorite: true,
        date: new Date().toLocaleDateString('pt-BR')
      },
      {
        id: '2',
        title: 'Chrono Trigger',
        category: 'game',
        rating: 5,
        imageUrl: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500',
        tag: 'RPG Clássico',
        review: 'O melhor RPG de todos os tempos. Múltiplos finais, personagens carismáticos e arte de Akira Toriyama.',
        favorite: false,
        date: new Date().toLocaleDateString('pt-BR')
      }
    ];

    // Estado da Aplicação
    let reviews = JSON.parse(localStorage.getItem('central_resenhas_data')) || initialReviews;
    let currentCategory = 'todos';
    let searchQuery = '';
    let currentSort = 'newest';

    // Elementos DOM
    const reviewForm = document.getElementById('reviewForm');
    const cardsGrid = document.getElementById('cardsGrid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const imageUrlInput = document.getElementById('imageUrl');
    const imagePreview = document.getElementById('imagePreview');
    const themeToggle = document.getElementById('themeToggle');
    const toast = document.getElementById('toast');

    // Estatísticas DOM
    const totalCountEl = document.getElementById('totalCount');
    const avgRatingEl = document.getElementById('avgRating');
    const favCountEl = document.getElementById('favCount');

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      saveAndRender();
      setupEventListeners();
    });

    function setupEventListeners() {
      // Form Submissão
      reviewForm.addEventListener('submit', handleAddReview);

      // Preview de Imagem
      imageUrlInput.addEventListener('input', (e) => {
        const url = e.target.value;
        if (url) {
          imagePreview.src = url;
          imagePreview.style.display = 'block';
        } else {
          imagePreview.style.display = 'none';
        }
      });

      // Pesquisa em tempo real
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderCards();
      });

      // Ordenação
      sortSelect.addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderCards();
      });

      // Filtros de Categoria
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.category;
          renderCards();
        });
      });

      // Alternador de Tema
      themeToggle.addEventListener('click', toggleTheme);
    }

    // Adicionar Nova Resenha
    function handleAddReview(e) {
      e.preventDefault();

      const ratingInput = document.querySelector('input[name="rating"]:checked');
      if (!ratingInput) {
        showToast('Por favor, selecione uma nota em estrelas!');
        return;
      }

      const newReview = {
        id: Date.now().toString(),
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        rating: parseInt(ratingInput.value),
        imageUrl: imageUrlInput.value || '',
        tag: document.getElementById('tag').value,
        review: document.getElementById('review').value,
        favorite: false,
        date: new Date().toLocaleDateString('pt-BR')
      };

      reviews.unshift(newReview);
      saveAndRender();
      reviewForm.reset();
      imagePreview.style.display = 'none';
      showToast('Resenha publicada com sucesso!');
    }

    // Salvar e Renderizar Tudo
    function saveAndRender() {
      localStorage.setItem('central_resenhas_data', JSON.stringify(reviews));
      updateStats();
      renderCards();
    }

    // Atualizar Métricas / Estatísticas
    function updateStats() {
      totalCountEl.textContent = reviews.length;
      
      const favs = reviews.filter(r => r.favorite).length;
      favCountEl.textContent = `${favs} ❤️`;

      if (reviews.length === 0) {
        avgRatingEl.textContent = '0.0 ⭐';
        return;
      }

      const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
      const avg = (sum / reviews.length).toFixed(1);
      avgRatingEl.textContent = `${avg} ⭐`;
    }

    // Renderizar Cards Filtrados e Ordenados
    function renderCards() {
      let filtered = reviews.filter(review => {
        const matchesCategory = currentCategory === 'todos' || review.category === currentCategory;
        const matchesSearch = review.title.toLowerCase().includes(searchQuery) ||
                              review.tag.toLowerCase().includes(searchQuery) ||
                              review.review.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      // Ordenar
      if (currentSort === 'rating-high') {
        filtered.sort((a, b) => b.rating - a.rating);
      } else if (currentSort === 'rating-low') {
        filtered.sort((a, b) => a.rating - b.rating);
      } // Default: 'newest' mantém a ordem do array (já invertido no unshift)

      if (filtered.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            <span>🔍</span>
            <p>Nenhuma resenha encontrada.</p>
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = filtered.map(item => `
        <article class="card">
          ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-img" alt="${item.title}" onerror="this.style.display='none'">` : ''}
          <div class="card-body">
            <div class="card-header-info">
              <h3 class="card-title">${escapeHTML(item.title)}</h3>
              <span class="badge">${item.category}</span>
            </div>
            
            <div class="card-rating">
              ${'★'.repeat(item.rating)}${'☆'.repeat(5 - item.rating)}
            </div>

            <p class="card-review">${escapeHTML(item.review)}</p>

            ${item.tag ? `<span class="card-tag">#${escapeHTML(item.tag)}</span>` : ''}

            <div class="card-footer">
              <span>${item.date}</span>
              <div class="card-actions">
                <button class="action-btn" onclick="toggleFavorite('${item.id}')" title="Favoritar">
                  ${item.favorite ? '❤️' : '🤍'}
                </button>
                <button class="action-btn" onclick="deleteReview('${item.id}')" title="Excluir">
                  🗑️
                </button>
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    // Alternar Favorito
    window.toggleFavorite = function(id) {
      reviews = reviews.map(r => r.id === id ? {...r, favorite: !r.favorite} : r);
      saveAndRender();
    };

    // Deletar Resenha
    window.deleteReview = function(id) {
      if (confirm('Tem certeza que deseja excluir esta resenha?')) {
        reviews = reviews.filter(r => r.id !== id);
        saveAndRender();
        showToast('Resenha excluída.');
      }
    };

    // Toggle de Tema Claro/Escuro
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      
      html.setAttribute('data-theme', newTheme);
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('themeText').textContent = isDark ? 'Modo Claro' : 'Modo Escuro';
    }

    // Utilitários
    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
